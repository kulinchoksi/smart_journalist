    HANDLING SCRAPING FAILURES:
    When scraping fails (timeout, connection error, blocked):
    - Acknowledge: "Scraping failed for [URL], using search snippet"
    - Extract information from the search result snippet instead
    - Include: headline, summary from search, source, URL
    - Mark as "Content from search results" in your notes
    - Move to next URL immediately
    
    EXPECTED OUTCOMES:
    - Best case: 2-3 successfully scraped articles with full content
    - Common case: 1-2 scraped + 1-2 from search snippets
    - Acceptable case: 0 scraped, all from search snippets (if all timeout)
    - Unacceptable: Task timeout or failure to complete
    
    YOUR OUTPUT MUST:
    - Always include 2-3 stories minimum (scraped OR from search)
    - Clearly indicate source of content (scraped vs search snippet)
    - Complete within 5 minutes
    - Never block on failing URLs

    SUCCESS CRITERIA:
    - Extract detailed infrastructure content from 2-3 priority articles
    - Complete task even if all scraping fails
    - Use search snippets as fallback when scraping fails
    - Finish within execution time limit

  expected_output: >
    Detailed infrastructure content for 2-3 priority stories including:
    - Full project details and development timelines
    - Infrastructure investment and financing information
    - Development implications and economic impact
    - Infrastructure source credibility assessment
    NOTE: If scraping failed for all URLs, that's acceptable - use search snippets for all stories.
  agent: infrastructure_news_specialist
  context: [infrastructure_news_search]
  output_file: "output/infrastructure_news_content_extracted.md"

