# FINAL REPORTING TASK
# Uses Pydantic structured output with Jinja2 template rendering
final_news_report:
  description: >
    Organize all verified news into a STRUCTURED JSON format that will be rendered into HTML.
    CRITICAL: You MUST output data in the specified Pydantic schema format. Do NOT generate HTML directly.
    
    DATA ORGANIZATION REQUIREMENTS:
    1. Executive Summary:
       - Write 3-5 paragraphs highlighting the top stories across all categories
       - Focus on significance, impact, and key takeaways
       - Mention geopolitical, economic, and technological highlights      
    
    2. FEATURED STORIES:
       - Select 5-10 most significant stories across ALL categories and regions
       - Include stories with highest confidence scores (8-10)
       - Ensure diversity across categories
       - Include full story details with source URLs
    
    3. REGIONAL NEWS ORGANIZATION:
       For each region (World, India, Ahmedabad):
       - Organize stories by category (Political, Economy, Technology, Science, Stock Market, Energy, Infrastructure)
       - Include ONLY stories relevant to that region
       - For each story, provide:
         * headline: Clear, factual headline
         * summary: 2-3 sentence summary
         * source: Publication name
         * source_url: Direct URL to original article (REQUIRED - extract from verification reports)
         * category: One of the 7 categories
         * region: World/India/Ahmedabad
         * verification_status: Verified/Partially Verified/Developing/Unverified
         * confidence_score: 1-10 rating
         * timestamp: Publication time if available
         * key_points: Optional bullet points of key information
    
    4. METADATA COMPILATION:
       - Count total stories collected across all tasks
       - Count verified vs unverified stories
       - List all sources consulted
       - Record models used (gemini-1.5-flash for collection, gemini-2.5-pro for verification)
       - Calculate success rate
    
    DATA EXTRACTION STRATEGY:
    - Parse all 7 verification reports (political, economy, technology, science, stock_market, energy, infrastructure)
    - Extract stories with their complete metadata
    - Ensure source URLs are preserved from original search results
    - Categorize by both region AND category
    - Apply quality filters (prioritize verified stories with high confidence)
    
    QUALITY STANDARDS:
    - All stories must have complete information (no missing required fields)
    - Source URLs must be actual URLs from news sites
    - Confidence scores must reflect verification results
    - Regional classification must be accurate
    
    OUTPUT FORMAT:
    The output will be automatically validated against the NewsReport Pydantic schema and rendered to HTML using Jinja2 template.
  expected_output: >
    Complete NewsReport object with:
    - title: "Daily News Report"
    - generation_date: Today's date (YYYY-MM-DD format)
    - executive_summary: Comprehensive 3-5 paragraph summary
    - featured_stories: List of 5-10 top stories with full details
    - world_news: RegionalNews object with categorized stories
    - india_news: RegionalNews object with categorized stories  
    - ahmedabad_news: RegionalNews object with categorized stories
    - metadata: Complete ReportMetadata with statistics
    
    Example structure:
    {
      "title": "Daily News Report",
      "generation_date": "2025-11-10",
      "executive_summary": "Today's key developments...",
      "featured_stories": [
        {
