# POLITICAL NEWS TASKS (3-step workflow)
political_news_search:
  description: >
    Find high-quality political news articles for today ({date}) efficiently using search-only approach in regions: World, India and Ahmedabad.
    
    SEARCH TARGETS:
    - International relations and diplomacy developments
    - Domestic policy changes and government actions
    - Electoral developments and political party activities
    - Regulatory changes and policy implementations
    - Political conflicts, negotiations, and resolutions
    
    REGIONAL FOCUS:
    - World: Major international political developments, diplomatic initiatives, cross-border political issues
    - India: Parliamentary activities, central government policies, state politics, political party developments
    - Ahmedabad: Gujarat state politics, local governance, municipal developments, regional political implications
    
    SEARCH STRATEGY:
    - Use targeted search terms: "political news", "government policy", "diplomatic developments", "electoral updates"
    - Focus on credible political sources: Reuters, AP, BBC, Politico, government press releases
    - Look for stories from the last 24 hours with political significance
    - Extract: headline, snippet, source, URL, political impact assessment
    
    SUCCESS CRITERIA:
    - Find 4-6 significant political stories across regions
    - Ensure coverage of major political developments
    - Provide sufficient detail from search results for analysis

  expected_output: >
    List of 4-6 political news stories with:
    - Headline with political context
    - Summary emphasizing political implications  
    - Source name and political credibility rating
    - URL for content extraction
    - Regional relevance (World/India/Ahmedabad)
    - Political impact score (1-10)
    - Political category (Diplomacy/Domestic Policy/Electoral/Regulatory)
  agent: political_news_specialist
  output_file: "output/political_news_search_results.md"

political_news_content:
  description: >
    Extract detailed content from promising political news URLs found from search task.
    
    EXTRACTION PRIORITIES:
    - Government press releases and official statements (highest priority)
    - Major news outlets covering political developments
    - Political analysis from credible sources
    - Parliamentary or legislative body announcements
    
    CONTENT EXTRACTION FOCUS:
    - Full policy details and implications
    - Political quotes and official statements
    - Timeline of political events
    - Stakeholder positions and reactions
    - Economic or social implications of political decisions
    
    CONTENT EXTRACTION STRATEGY:
    1. Select top 3-4 most promising URLs from search results
    2. Attempt to scrape each URL in priority order
    3. For EACH URL attempt:
       - Try scraping with Read website content tool
       - If successful (< 30 seconds) → Use scraped content
       - If timeout/error → IMMEDIATELY skip, use search snippet instead
       - Do NOT retry failed URLs
    
    HANDLING SCRAPING FAILURES:
    When scraping fails (timeout, connection error, blocked):
    - Acknowledge: "Scraping failed for [URL], using search snippet"
    - Extract information from the search result snippet instead
    - Include: headline, summary from search, source, URL
    - Mark as "Content from search results" in your notes
    - Move to next URL immediately
    
    EXPECTED OUTCOMES:
    - Best case: 2-3 successfully scraped articles with full content
    - Common case: 1-2 scraped + 1-2 from search snippets
    - Acceptable case: 0 scraped, all from search snippets (if all timeout)
    - Unacceptable: Task timeout or failure to complete
    
    YOUR OUTPUT MUST:
    - Always include 2-3 stories minimum (scraped OR from search)
    - Clearly indicate source of content (scraped vs search snippet)
    - Complete within 5 minutes
    - Never block on failing URLs

    SUCCESS CRITERIA:
    - Successfully extract detailed content from 2-3 priority political articles  
    - Focus on articles with greatest political significance
    - Maintain content accuracy and political context
    - Complete task even if all scraping fails
    - Use search snippets as fallback when scraping fails
    - Finish within execution time limit

  expected_output: >
    Detailed political content for 2-3 priority stories including:
    - Full article headline and political context
    - Complete article text with key political details
    - Official quotes and statements
    - Political implications and analysis
    - Author credentials and publication information
    - Political source credibility assessment
    NOTE: If scraping failed for all URLs, that's acceptable - use search snippets for all stories.
  agent: political_news_specialist
  context: [political_news_search]
  output_file: "output/political_news_content_extracted.md"

political_news_verification:
  description: >
    Rigorously verify all collected political news for accuracy, reliability, and credibility while filtering out political misinformation.
    
    POLITICAL VERIFICATION PROCESS:
    - Cross-reference political claims through official government sources
    - Verify political quotes and statements through original sources
    - Check policy information against official government releases
    - Confirm electoral information through election commission sources
    - Validate diplomatic news through foreign ministry communications
    
    POLITICAL SOURCE VERIFICATION:
    - Government websites and official press releases
    - Parliamentary records and legislative documents  
    - International organization statements
    - Embassy and diplomatic mission communications
    - Credible political analysis from established institutions
    
    MISINFORMATION DETECTION:
    - Flag unverified political claims
    - Identify potential propaganda or bias
    - Check for political manipulation or spin
    - Verify numerical data and statistics
    - Confirm dates and timeline accuracy
    
    SUCCESS CRITERIA:
    - Verify accuracy of all key political claims
    - Identify and flag any questionable political information
    - Provide confidence ratings for political stories
    - Complete verification within 5 minutes
  expected_output: >
    Political verification report including:
    - Story verification status (Verified/Partially Verified/Needs Review)
    - Political source credibility assessment  
    - Cross-reference results with official sources
    - Political bias or misinformation flags
    - Confidence rating for political accuracy (1-10)
    - Recommendations for story inclusion and prominence
  agent: political_news_specialist
  context: [political_news_search, political_news_content]
  output_file: "output/political_news_verification_report.md"

